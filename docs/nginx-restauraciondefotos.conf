server {
    server_name restauraciondefotos.com.ar www.restauraciondefotos.com.ar;

    root /var/www/html/public/tutienditaia/restauraciondefotos;
    index index.html;

    client_max_body_size 320m;

    # Archivos compartidos de la tienda (tienda.js, movil.css, movil.js)
    # Redirecciones canonicas a dominios propios
    location = /tutienditaia/restauraciondefotos { return 301 https://restauraciondefotos.com.ar/; }
    location = /tutienditaia/restauraciondefotos/ { return 301 https://restauraciondefotos.com.ar/; }
    location = /tutienditaia/restauraciondefotos/index.html { return 301 https://restauraciondefotos.com.ar/; }
    location = /tutienditaia/tucancion { return 301 https://tucancion.com.ar/; }
    location = /tutienditaia/tucancion/ { return 301 https://tucancion.com.ar/; }
    location = /tutienditaia/tucancion/index.html { return 301 https://tucancion.com.ar/; }

    location ^~ /tutienditaia/ {
        root /var/www/html/public;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # API de pedidos y catalogo
    location ^~ /tutienditaia/api/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 320m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 320m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Enlaces de revision y atencion
    location ^~ /tutienditaia/revisar/ {
        proxy_pass http://127.0.0.1:8091/revisar/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /revisar/ {
        proxy_pass http://127.0.0.1:8091/revisar/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloqueo de archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/restauraciondefotos.com.ar/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/restauraciondefotos.com.ar/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.restauraciondefotos.com.ar) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = restauraciondefotos.com.ar) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name restauraciondefotos.com.ar www.restauraciondefotos.com.ar;
    return 404; # managed by Certbot




}