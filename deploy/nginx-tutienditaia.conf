# Tu Tiendita IA: pegar dentro del server { … } HTTPS de campuscfp401avellaneda.com.ar, ANTES de los location ~ de Moodle.

location ^~ /tutienditaia/api/ {
    proxy_pass http://127.0.0.1:8091/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 320m;        # hasta 20 fotos de 15 MB
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# link corto para que el cliente apruebe o pida un cambio: /tutienditaia/revisar/RF-0001?t=…
location ^~ /tutienditaia/revisar/ {
    proxy_pass http://127.0.0.1:8091/revisar/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /tutienditaia/ {
    root /var/www/html/public;        # /tutienditaia/x → /var/www/html/public/tutienditaia/x (con root; alias + try_files falla)
    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
